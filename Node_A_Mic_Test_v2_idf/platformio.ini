; ESP32-S3 N16R8 — USB UAC microphone fed by ESP-NOW from Node B (A1S)
; Sibling of Node_A_USB_Debug_v3_idf (which proved the IDF UAC path with a
; synthetic tone). This project replaces the tone with PCM decoded from
; ADPCM packets received over ESP-NOW.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload
; (Required when the USB-audio firmware is already running, because /dev/ttyACM0
;  disappears in that mode.)

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; The patched copy of espressif/usb_device_uac lives in the v3 project's
; components/ folder and is referenced from src/idf_component.yml via
; override_path. See Node_A_USB_Debug_v3_idf/DEBUGGING_JOURNEY.md section 9
; for why the patch (target_sources PUBLIC -> PRIVATE on usb_descriptors.c)
; is needed for PlatformIO's SCons builder.
