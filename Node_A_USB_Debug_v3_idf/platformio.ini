; ESP32-S3 N16R8 — USB UAC microphone (mic-only) via esp_device_uac
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload

[env:esp32s3_n16r8]
; Pin platform to avoid surprise breaking updates
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; usb_device_uac@1.2.3 ships a CMakeLists.txt that breaks PlatformIO's
; SCons builder ("Two environments with different actions ... usb_descriptors.c.o").
; Fix: vendored & patched copy in components/usb_device_uac, pulled via
; `override_path` in src/idf_component.yml. No extra build hooks needed.
