; ESP32-S3 N16R8 -- bisection Test B for the bridge speaker bug.
;
; Identical to Node_A_Spk_Mic_Test_idf (Test C, which works) EXCEPT the
; UAC sample rate is 48 kHz instead of 44.1 kHz. Everything else stays
; the same:
;   - Speaker: stereo, ADPCM 240 B packets to Node_B_Audio.ino (unchanged)
;   - Mic:     mono, silent input_cb
;   - N_AS_INT=2 codepath in the patched usb_device_uac
;
; Goal: isolate whether the bridge's 48 kHz mono spk failure is caused by
;   (a) the 48 kHz sample rate itself, or
;   (b) the mono speaker channel count.
; If LED stays WHITE here (audio may sound slow on Node B because it still
; decodes at 44.1 kHz, that's expected and irrelevant) -> 48 kHz is fine,
; the bug is in mono speaker.
; If LED drops to GREEN-only -> 48 kHz is the trigger, dig into TinyUSB
; iso EP scheduling at 48 kHz with multiple AS interfaces.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; Uses the same patched usb_device_uac vendored under
; Node_A_USB_Debug_v3_idf/components/usb_device_uac.
