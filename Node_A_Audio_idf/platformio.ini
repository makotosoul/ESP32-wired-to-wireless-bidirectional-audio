; ESP32-S3 N16R8 — speaker-only USB UAC (44.1 kHz stereo) over ESP-NOW.
;
; Isolation test for the new IDF/PlatformIO speaker path. Pairs with the
; existing Node_B_Audio.ino (Arduino) on the A1S Audio Kit, which is the
; same wire format the old Node_A_Audio.ino used and which is known to
; work end-to-end. Goal: prove whether the patched usb_device_uac
; component handles the speaker OUT path correctly in IDF in isolation
; (mic disabled). If this plays, any failure in Node_A_Bridge_idf is due
; to the combined mic+speaker setup; if this also fails, the bug is in
; the component's speaker path itself.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload
; (Required when USB-audio firmware is running and /dev/ttyACM0 is hidden.)

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; Uses the patched usb_device_uac vendored under
; Node_A_USB_Debug_v3_idf/components/usb_device_uac (see src/idf_component.yml).
