; A1S Audio Kit V2.2 (ESP32, ES8388 codec) — bidirectional bridge end.
;
; Migrated from Arduino sketch (Node_B_Bridge/) because Arduino I2SClass
; serialises TX and RX, capping speaker playback at ~40 frames/sec when the
; mic is active. ESP-IDF's i2s_std driver gives us separate TX/RX channels
; with independent DMA, removing the mutex contention entirely.
;
; See BRIDGE_B_IDF_JOURNEY.md for the rationale and design notes.

[env:a1s_audio_kit]
platform = espressif32@6.10.0
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
    -DCONFIG_FREERTOS_HZ=1000
