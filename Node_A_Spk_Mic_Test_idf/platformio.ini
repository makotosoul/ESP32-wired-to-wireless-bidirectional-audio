; ESP32-S3 N16R8 — bisection Test C for the bridge speaker bug.
;
; Identical to Node_A_Audio_idf (44.1 kHz STEREO speaker over ESP-NOW to
; the unchanged Node_B_Audio.ino) PLUS a 44.1 kHz mono microphone
; interface that just returns silence to the host.
;
; Why this exists:
;   Node_A_Audio_idf (speaker-only) works -> patched usb_device_uac handles
;   the speaker OUT path correctly when MIC=0 / N_AS_INT=1. The bridge
;   (mic+spk both enabled) does NOT work -> the patched N_AS_INT=2 codepath
;   is the prime suspect.
;
;   This project enables BOTH AS interfaces (MIC=1 + SPK=2 -> N_AS_INT=2)
;   while keeping the speaker side bit-for-bit identical to the working
;   audio_idf. If the speaker still plays here, the N_AS_INT=2 path is
;   fine and the bridge bug must be in {48 kHz, mono spk, or their
;   combination with mic}. If the speaker stops, we've reproduced the
;   bridge bug in a minimal setting and the fix is in the patched
;   usb_device_uac component.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; Uses the same patched usb_device_uac vendored under
; Node_A_USB_Debug_v3_idf/components/usb_device_uac (see src/idf_component.yml).
