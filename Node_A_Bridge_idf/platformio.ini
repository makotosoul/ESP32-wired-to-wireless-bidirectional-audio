; ESP32-S3 N16R8 — bidirectional USB UAC bridge (48 kHz mono mic + speaker)
; Host speaker -> ESP-NOW -> Node B DAC; Node B ADC -> ESP-NOW -> host mic.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload
; (Required when USB-audio firmware is running and /dev/ttyACM0 is hidden.)

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; Patched usb_device_uac: see Node_A_USB_Debug_v3_idf/DEBUGGING_JOURNEY.md section 9.
