; ESP32-S3 N16R8 -- bisection Test A for the bridge speaker bug.
;
; Identical to Node_A_Spk_Mic_Test_48k_idf (Test B, which works) EXCEPT the
; UAC speaker channel count is MONO instead of STEREO:
;   CONFIG_UAC_SPEAKER_CHANNEL_NUM: 2 -> 1
;
; Everything else unchanged:
;   - 48 kHz sample rate (mic + speaker)
;   - Silent mono mic, N_AS_INT=2 codepath
;   - ADPCM 240 B packets to Node_B_Audio.ino (mono duplicated to L/R for wire)
;
; Goal: reproduce the bridge UAC layout (48 kHz mono spk + mono mic) while
; keeping the same minimal test harness as Test B.
;
; If LED stays WHITE -> mono UAC + dual AS is fine; bridge bug is in
;   Node_A_Bridge_idf application logic (ESP-NOW, tasks, encode).
; If LED is GREEN-only -> mono speaker channel count is the trigger; fix
;   patched usb_device_uac descriptors / iso packet sizing.
;
; Flash: hold BOOT, tap RST, release BOOT, then: pio run -t upload

[env:esp32s3_n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCONFIG_FREERTOS_HZ=1000

; Uses the same patched usb_device_uac vendored under
; Node_A_USB_Debug_v3_idf/components/usb_device_uac.
